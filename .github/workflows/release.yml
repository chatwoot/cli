name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Write outside the working tree so the repo stays clean for GoReleaser.
          awk -v ver="$version" '
            # Stop at the next version heading or the link-reference footer.
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            /^## \[/ && index($0, "[" ver "]") { found=1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if [ ! -s "$RUNNER_TEMP/release_notes.md" ]; then
            echo "::error::No CHANGELOG.md section found for version $version"
            exit 1
          fi
          echo "----- release notes for $version -----"
          cat "$RUNNER_TEMP/release_notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "2.15.4"
          args: release --clean --release-notes=${{ runner.temp }}/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
