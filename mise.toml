[tools]
go = "latest"
watchexec = "latest"
"aqua:golangci/golangci-lint" = "latest"

[tasks.build]
description = "Build the CLI"
run = "mkdir -p ./bin && go build -o ./bin/chatwoot ./cmd/chatwoot/"

[tasks.dev]
description = "Auto-build on Go file changes"
run = "mkdir -p ./bin && watchexec -e go --restart --debounce 300 -- go build -o ./bin/chatwoot ./cmd/chatwoot/"

[tasks.lint]
description = "Run golangci-lint across the module"
run = "golangci-lint run ./..."

[tasks."sdk:update-swagger"]
description = "Update the pinned Chatwoot application Swagger snapshot"
run = "curl -fL https://raw.githubusercontent.com/chatwoot/chatwoot/develop/swagger/tag_groups/application_swagger.json -o internal/sdk/testdata/application_swagger.json"

[tasks.agents]
description = "Create AGENTS.md symlinks to CLAUDE.md in all module directories"
run = """
find . -name "CLAUDE.md" -type f | while read file; do
  dir=$(dirname "$file")
  ln -sf CLAUDE.md "$dir/AGENTS.md"
  echo "Created symlink: $dir/AGENTS.md -> CLAUDE.md"
done
"""
